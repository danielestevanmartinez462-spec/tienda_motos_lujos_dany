{% extends 'tienda/base.html' %}

{% block titulo %}{{ titulo }} | Motos Lujo{% endblock %}

{% block contenido %}
<section class="formulario-seccion">

    <div class="formulario-caja">
        <p class="marca">MOTOS LUJO</p>

        <h1 class="titulo-seccion">{{ titulo }}</h1>

        <p>Completa los datos solicitados para guardar la información.</p>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <div class="acciones-formulario">
                <button type="submit" class="boton">
                    Guardar
                </button>

                <a href="javascript:history.back()" class="boton boton-secundario">
                    Cancelar
                </a>
            </div>
        </form>
    </div>

</section>
{% endblock %}
